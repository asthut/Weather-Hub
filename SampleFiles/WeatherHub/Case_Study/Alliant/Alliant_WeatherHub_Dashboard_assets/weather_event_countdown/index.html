<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>@font-face{font-family:Mark;src:url('assets/fonts/MarkPro.otf')}@font-face{font-family:Mark;src:url('assets/fonts/MarkPro-Bold.otf');font-weight:700}*{box-sizing:border-box}body{margin:0;font-family:Mark,Arial;color:#111820}.widget{border:1px solid #d8e0e7;border-radius:7px;overflow:hidden}.header{padding:13px 14px;border-bottom:1px solid #d8e0e7;font-size:16px;font-weight:700}.section{margin:12px 14px;padding:12px;border:1px solid #d8e0e7;border-radius:8px}.top{display:flex;justify-content:space-between;gap:20px}.title{font-size:17px;font-weight:700}.event{margin:14px 0}.peril,.value{font-weight:700}.countdown{color:#008bd2;font-size:22px;font-weight:700}.meta{text-align:right}.badge{display:inline-block;background:#ffd2cf;border-radius:6px;padding:5px 9px;font-size:12px}.size{background:#ffe0cf}.report{width:100%;padding:9px;border:1px solid #cbd4dc;border-radius:5px;font:700 14px Mark;cursor:pointer}.tabs{text-align:center;margin:10px}.tab{padding:8px 15px;border:1px solid #cbd4dc;border-radius:6px;font:13px Mark;cursor:pointer}.active{border-color:#008bd2;background:#e2f3fb;color:#006da5;font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{padding:9px;border:1px solid #d8e0e7;border-radius:6px}.best{background:#e2f3fb;border-color:#008bd2}.label{font-size:12px;color:#526272}.value{font-size:18px;margin-top:5px}.level{margin-top:18px;font-size:13px}.levelbox{padding:8px 11px;border:1px solid #cbd4dc;border-radius:5px}.divisions{max-width:820px;margin:14px auto;border:1px solid #d8e0e7;border-radius:8px;padding:12px}.division{display:grid;grid-template-columns:1fr 2fr;gap:15px;margin:12px 0;color:#526272}.numbers{display:flex;justify-content:space-between;font-size:11px}.range{height:4px;background:#67b9e8;position:relative;margin-top:8px}.diamond{position:absolute;width:11px;height:11px;background:#111820;transform:rotate(45deg);top:-4px;left:calc(var(--position) - 5px)}.modal{display:none;position:fixed;inset:0;background:#0008;padding:20px}.modal.open{display:flex;align-items:center;justify-content:center}.dialog{width:min(700px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:8px;padding:16px}.close{float:right}table{border-collapse:collapse;width:100%}td{border:1px solid #d8e0e7;padding:6px}@media(max-width:700px){.top{display:block}.meta{text-align:left}.cards{grid-template-columns:1fr}.division{grid-template-columns:1fr}}</style></head><body><main class='widget'><header class='header'>Weather Event Countdown</header><section class='section'><div class='top'><div><div class='title'>Meteorologist Prediction</div><div class='event'><div class='peril' id='peril'></div><div class='countdown' id='countdown'></div></div></div><div class='meta'><span class='badge' id='confidence'></span><p id='dates'></p></div></div><button class='report' id='report'>View Meteorologist Report</button></section><section class='section'><div class='top'><div class='title'>Forecast Model</div><span class='badge size' id='size'></span></div><div class='tabs'><button class='tab active' id='incidents'>Incidents</button><button class='tab' id='customers'>Customers Out</button></div><div class='cards' id='cards'></div><div class='level'>Level</div><div class='levelbox'>Division</div><div class='divisions' id='divisionRows'></div></section></main><div class='modal' id='modal'><div class='dialog'><button class='close' id='close'>x</button><h3>Discussion</h3><div id='discussion'></div><p><a href='assets/MeteorologistSummary.docx' download>Download Meteorologist Report</a></p></div></div><script id='widgetData' type='application/json'>{"peril": "Thunderstorms", "countdown": "1d 22h 0m", "confidence": "Medium", "start": "06/10/2026 at 10:30am", "end": "06/11/2026 at 12:00am", "size": "Large Event", "incidents": [652, 932, 1211], "customers": [35880, 51258, 66635], "divisions": [{"number": 1, "name": "WPL CENTRAL", "outages": [14537, 20767, 26997], "incidents": [264, 378, 491]}, {"number": 2, "name": "WPL NORTHEAST", "outages": [3263, 4623, 6010], "incidents": [59, 84, 109]}, {"number": 3, "name": "WPL SOUTHWEST", "outages": [18108, 25868, 33628], "incidents": [329, 470, 611]}], "report": "<p>06/10/2026 7:00 AM CDT UPDATE: \n\nA strong low pressure system will track into the region later today bringing the potential for severe thunderstorms including damaging winds and hail as the primary perils. There is a possibility the line of storms could evolve into a derecho. Thunderstorms are expected to advance into WPL Southwest by around 1pm and quickly move to the northeast arriving in Madison by 2pm. Storms will continue to press northeast impacting the Central and Northeast Territories. Severe impacts will most confidently be in the Central and Southwest Territories. The lion-share of severe weather will exit by 5pm. However, residual thunderstorms will redevelop with remaining instability and will last till around midnight. The second round is not expected to be as severe as the initial threat.<\/p>"}</script><script>(()=>{const d=JSON.parse(document.getElementById('widgetData').textContent),$=id=>document.getElementById(id),fmt=v=>v==null?'':new Intl.NumberFormat('en-US').format(v);$('peril').textContent=(d.peril||'Event')+' in';$('countdown').textContent=d.countdown;$('confidence').textContent=d.confidence?d.confidence+' Confidence':'';$('size').textContent=d.size;$('dates').innerHTML='<b>'+d.start+'</b> -<br><b>'+d.end+'</b>';function drawDivisions(metric){const field=metric==='incidents'?'incidents':'outages';$('divisionRows').innerHTML=d.divisions.map(x=>{const q=x[field]||[],valid=q.filter(v=>v!=null);if(!valid.length)return '';const lo=Math.min(...valid),hi=Math.max(...valid),pos=q[1]==null?0:(q[1]-lo)/Math.max(1,hi-lo)*100;return '<div class="division"><div>'+x.number+' '+x.name+'</div><div><div class="numbers"><span>'+fmt(q[0])+'</span><b>'+fmt(q[1])+'</b><span>'+fmt(q[2])+'</span></div><div class="range" style="--position:'+pos+'%">'+(q[1]==null?'':'<span class="diamond"></span>')+'</div></div></div>'}).join('')||'<div class="label">No division data available for this metric.</div>'}function draw(metric){const q=d[metric];$('cards').innerHTML=['Low Forecast','Best Forecast','High Forecast'].map((label,i)=>q[i]==null?'':'<div class="card '+(i===1?'best':'')+'"><div class="label">'+label+'</div><div class="value">'+fmt(q[i])+'</div></div>').join('');$('incidents').classList.toggle('active',metric==='incidents');$('customers').classList.toggle('active',metric==='customers');drawDivisions(metric)}draw('incidents');$('incidents').onclick=()=>draw('incidents');$('customers').onclick=()=>draw('customers');$('discussion').innerHTML=d.report;const modal=$('modal');$('report').onclick=()=>modal.classList.add('open');$('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')}})();</script></body></html>
